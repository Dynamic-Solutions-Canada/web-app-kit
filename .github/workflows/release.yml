name: Release

# Creates the GitHub Release for a vX.Y.Z tag (REL-5, REL-11, KIT-6). Runs the same gate as CI
# first, fails when the tag, the version in package.json and the notes file disagree, and never
# falls back to generated notes (REL-6). Apps install the kit from the tag itself, so nothing is
# attached.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Anything that publishes never cancels a run in progress (CI-5).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    # Install, the gate and the React 18 pass; the cap only stops a hung run.
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Run the gate
        run: npm run validate

      - name: Typecheck and test on React 18
        run: npm run test:react18

  release:
    name: Create GitHub Release
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The tag, the version source and the notes file must name the same version.
      - name: Check version and notes
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          declared="$(node -p "require('./package.json').version")"
          if [[ "$declared" != "$version" ]]; then
            echo "::error::Tag $TAG does not match version $declared in package.json"
            exit 1
          fi
          notes="release-notes/$version.md"
          if [[ ! -s "$notes" ]]; then
            echo "::error::Missing or empty $notes; release notes are written and committed before tagging"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      # The notes file holds bullets only; the heading, pin instructions and disclosure are added here.
      - name: Assemble release body
        env:
          NOTES: ${{ steps.version.outputs.notes }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## What's new"
            echo
            cat "$NOTES"
            echo
            echo "## Using this version"
            echo
            echo "Change the \`#v...\` suffix of the web-app-kit dependency in your app's \`package.json\` to \`#$TAG\`, run \`npm install\` and then \`npm install-scripts approve @dynamic-solutions-canada/web-app-kit@$VERSION\`, and commit the pin bump with its lockfile. See the README for setup."
            echo
            echo "*AI disclosure: this release and the related code were written with the assistance of AI.*"
          } > "$RUNNER_TEMP/release-body.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "web-app-kit $VERSION" \
            --notes-file "$RUNNER_TEMP/release-body.md" \
            --latest
