name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    # Install, the gate and a second test pass on React 18 take a few minutes; the cap only
    # stops a hung run.
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Run the gate
        run: npm run validate

      # The peer range still admits React 18 for the apps not yet on 19; remove this step when
      # the range narrows.
      - name: Typecheck and test on React 18
        run: npm run test:react18
